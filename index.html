<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفشّار 🤥 — شاشة المذيع</title>
  <link rel="stylesheet" href="css/style.css?v=11191443">
</head>
<body class="is-host">
  <div class="host">
    <div class="host-top">
      <div class="logo">الفشّار <span>🤥</span></div>
      <div class="phase-info" id="phaseInfo"></div>
      <div class="meta">
        <span id="modeBadge" class="mode-badge hidden">وضع التجربة</span>
        <span id="roomLabel" class="room-label"></span>
      </div>
      <div class="controls" id="topControls">
        <button class="btn small ghost" id="btnPlus" title="زوّد الوقت">+15 ثانية</button>
        <button class="btn small ghost" id="btnEnd" title="اقفل المرحلة دي على طول">خلّص دلوقتي ⏭</button>
        <button class="btn small ghost" id="btnSwap" title="بدّل السؤال بسؤال احتياطي">سؤال تاني 🔄</button>
        <button class="btn small ghost" id="btnMute" title="الصوت">🔊</button>
        <button class="btn small ghost" id="btnNew" title="لعبة جديدة من الأول">🆕</button>
      </div>
    </div>
    <div class="alertbar hidden" id="alert"></div>
    <div class="stage" id="stage"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/config.js?v=11191443"></script>
  <script src="js/qr.js?v=11191443"></script>
  <script src="js/text.js?v=11191443"></script>
  <script src="js/ui.js?v=11191443"></script>
  <script src="js/questions.js?v=11191443"></script>
  <script src="js/db.js?v=11191443"></script>
  <script src="js/sound.js?v=11191443"></script>
  <script src="js/howto_marks.js?v=11191443"></script>
  <script src="js/howto.js?v=11191443"></script>
  <script src="js/host.js?v=11191443"></script>
</body>
</html>
